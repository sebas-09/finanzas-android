name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test :app:assembleDebug :app:assembleDebugAndroidTest :core:database:assembleDebugAndroidTest :app:assembleRelease lint --no-parallel --max-workers=1 --console=plain
      - run: python3 tooling/verify-manifest.py debug
      - run: python3 tooling/verify-manifest.py release
      - name: Review release dependencies and privacy
        run: |
          mkdir -p build
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > build/dependencies-release.log
          python3 tooling/audit-privacy.py --dependency-report build/dependencies-release.log --output build/privacy-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/apk/debug/*.apk
            build/dependencies-release.log
            build/privacy-audit.json
  instrumented:
    # Las pruebas de cifrado necesitan Android real/emulado, no mocks JVM.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :core:database:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-parallel --max-workers=1 --console=plain
            pwsh -File tooling/test-process-restart.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-api-${{ matrix.api }}
          path: '**/build/reports/androidTests/'

